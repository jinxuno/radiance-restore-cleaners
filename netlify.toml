# Site lives in radiance-restore-website/. Netlify's UI base is the repo root,
# so point it at the publish folder and the functions inside it.
[build]
  publish = "radiance-restore-website"

[functions]
  directory = "radiance-restore-website/netlify/functions"

# Internal VA desk and the partner service guides it links to: keep them out of search results.
[[headers]]
  for = "/partner-desk/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"

[[headers]]
  for = "/partner-guides/*"
  [headers.values]
    X-Robots-Tag = "noindex"
